<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 15px; }
      label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
      table { margin-top: 12px; border-collapse: collapse; font-size: 12px; width: 100%; }
      td { padding: 2px 0; }
      td:first-child { font-weight: 700; width: 60px; }
    </style>
  </head>
  <body>
    <h1>Reels Control Bar</h1>
    <label>Enabled <input type="checkbox" id="enabled" /></label>
    <label>Auto-next <input type="checkbox" id="autoNext" /></label>
    <label>
      Speed
      <select id="speed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1">1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <table>
      <tr><td>K</td><td>Play / pause</td></tr>
      <tr><td>J / L</td><td>Rewind / forward 5 seconds</td></tr>
      <tr><td>N / P</td><td>Next / previous reel</td></tr>
      <tr><td>M</td><td>Mute / unmute</td></tr>
      <tr><td>[ / ]</td><td>Slower / faster</td></tr>
      <tr><td>0</td><td>Reset speed</td></tr>
      <tr><td>A</td><td>Auto-next on/off</td></tr>
    </table>
    <script src="popup.js"></script>
  </body>
</html>
